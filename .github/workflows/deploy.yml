name: Deploy JoyDigi HR

on:
  push:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: joydigi-hr-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy Production
    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      # The Firebase Admin private key, installed before the deploy step so
      # that the service restart at the end of it comes back up already able
      # to send push notifications.
      #
      # The JSON travels over ssh stdin — never as a command argument, which
      # would be visible in the server's process list, and never through
      # echo, which would put a private key into the build log. `umask 077`
      # means the file is not even briefly readable by anyone else between
      # being created and being chmod'ed.
      #
      # Absent secret is not a failure: push simply stays disabled and the
      # in-app notifications keep working, which is exactly how
      # `joydigi_api/push.py` behaves without a credential.
      - name: Install Firebase credential
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "FIREBASE_SERVICE_ACCOUNT_JSON is not set." >&2
            echo "Skipping: push stays disabled, in-app notifications unaffected." >&2
            exit 0
          fi

          # Validated here, on the runner, before a single byte is sent:
          # a malformed secret must fail this step rather than land on the
          # server. stderr is discarded on purpose — a JSONDecodeError
          # quotes the document it failed on, and that document is the
          # private key.
          if ! printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" \
            | python3 -c 'import json,sys; json.load(sys.stdin)' 2>/dev/null; then
            echo "::error title=Invalid Firebase credential::FIREBASE_SERVICE_ACCOUNT_JSON is not valid JSON. Nothing was sent to the server."
            exit 1
          fi

          # The remote script is an ARGUMENT, not a heredoc, and that is
          # the whole point of this shape.
          #
          # It used to be `... | ssh ... 'bash -s' <<'REMOTE'`, which asks
          # two different things to be ssh's stdin. The redirection wins,
          # so the JSON from the pipe was discarded and the remote
          # `cat > "$TMP"` swallowed the remainder of its own script
          # instead — the credential file was written with shell source
          # code, `mv` was never reached because those lines had been
          # eaten, and the step still exited 0. Reproduced byte for byte:
          # `cat` received 187 bytes of script where 212 bytes of JSON
          # were intended, no credential was ever created, and every
          # deploy reported success. That is why push has been silently
          # off in production.
          #
          # As an argument the script travels on the remote command line,
          # which is visible in the server's process list — it contains
          # only paths, never the secret. The secret stays on stdin,
          # exactly as before, so it appears in no process list on either
          # machine and in no log. Single-quoted so the runner's shell
          # expands none of the remote variables; the inner python
          # therefore uses double quotes, which is safe because it
          # contains no `$` for the remote shell to touch.
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" | ssh \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            -i ~/.ssh/id_ed25519 \
            "$VPS_USER@$VPS_HOST" \
            '
          set -eu
          umask 077
          CRED_DIR=/var/www/joydigi-hr/secrets
          CRED="$CRED_DIR/firebase-service-account.json"

          mkdir -p "$CRED_DIR"
          chmod 700 "$CRED_DIR"

          # Written to a temporary file first, so a transfer that dies
          # halfway cannot leave a truncated credential in place of a
          # working one.
          TMP="$CRED.incoming"
          cat > "$TMP"
          if ! python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$TMP" 2>/dev/null; then
            rm -f "$TMP"
            echo "received credential is not valid JSON; nothing was installed" >&2
            exit 1
          fi
          chmod 600 "$TMP"
          mv "$TMP" "$CRED"

          echo "Firebase credential installed"
          '

      # Point Django at the credential. The line is rewritten rather than
      # appended blindly, so deploying any number of times leaves exactly
      # one FIREBASE_CREDENTIALS_FILE entry, and every other value already
      # in .env — database, SECRET_KEY, ALLOWED_HOSTS — is carried across
      # untouched.
      - name: Configure FIREBASE_CREDENTIALS_FILE in .env
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            -i ~/.ssh/id_ed25519 \
            "$VPS_USER@$VPS_HOST" \
            'bash -s' <<'REMOTE'
          set -eu
          umask 077
          ENV_FILE=/var/www/joydigi-hr/.env
          LINE="FIREBASE_CREDENTIALS_FILE=/var/www/joydigi-hr/secrets/firebase-service-account.json"

          touch "$ENV_FILE"

          # Rebuilding the file is what makes this idempotent: dropping any
          # existing entry and re-adding one leaves no duplicates however
          # many times it runs, and grep's output always ends in a newline
          # so a file that was missing its final newline is fixed too.
          TMP="$ENV_FILE.incoming"
          grep -v '^FIREBASE_CREDENTIALS_FILE=' "$ENV_FILE" > "$TMP" || true
          echo "$LINE" >> "$TMP"
          chmod --reference="$ENV_FILE" "$TMP" 2>/dev/null || chmod 600 "$TMP"
          mv "$TMP" "$ENV_FILE"

          echo "FIREBASE_CREDENTIALS_FILE set in .env"
          REMOTE

      # Phase FUTURE-SAFE. This date is the switch that decides whether a
      # forgotten day shift is ever finalized at all: with no usable value
      # `finalization_cutoff()` returns None and the scheduled job returns
      # before it issues a single query. It is a policy date rather than a
      # credential, so it comes from a repository *variable* — visible and
      # editable in the settings UI without re-entering it — and never from
      # the repository, which must not carry a production date.
      #
      # Placed before "Deploy to VPS" deliberately: that step runs the
      # deploy script, and its `systemctl restart joydigi-hr` is what makes
      # gunicorn re-read settings. Writing the value afterwards would leave
      # every running worker on the old one until the next deployment.
      - name: Configure ATTENDANCE_FORGOTTEN_FINALIZATION_CUTOFF in .env
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          CUTOFF: ${{ vars.ATTENDANCE_FORGOTTEN_FINALIZATION_CUTOFF }}
        run: |
          # No value configured: say so and touch nothing. Writing an empty
          # entry, or dropping the existing one, would silently switch
          # finalization off on a deployment that never intended to.
          if [ -z "${CUTOFF:-}" ]; then
            echo "::warning title=Forgotten-session finalization not configured::The ATTENDANCE_FORGOTTEN_FINALIZATION_CUTOFF repository variable is empty or unset. Any value already present in the production .env is left exactly as it is; if there is none, forgotten day shifts are never finalized."
            exit 0
          fi

          # Validated here, on the runner, before a single byte reaches the
          # server: a bad value must not be able to replace a good one.
          if ! printf '%s' "$CUTOFF" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'; then
            echo "::error title=Invalid cutoff::ATTENDANCE_FORGOTTEN_FINALIZATION_CUTOFF must be exactly YYYY-MM-DD. The production .env was not modified."
            exit 1
          fi
          # Matching the shape is not being a date — 2026-02-30 and
          # 2026-13-01 both pass the pattern above. Round-tripping through
          # `date` rejects those, and comparing the result catches anything
          # it would quietly normalise rather than refuse.
          if ! normalised=$(date -u -d "$CUTOFF" +%Y-%m-%d 2>/dev/null) \
            || [ "$normalised" != "$CUTOFF" ]; then
            echo "::error title=Invalid cutoff::ATTENDANCE_FORGOTTEN_FINALIZATION_CUTOFF is not a real calendar date. The production .env was not modified."
            exit 1
          fi

          echo "Configuring forgotten-session finalization cutoff: $CUTOFF"

          # The value is a bare date, proven by the two checks above, so
          # interpolating it into the remote command is safe. It travels
          # that way rather than over stdin because stdin already carries
          # the script below.
          ssh \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            -i ~/.ssh/id_ed25519 \
            "$VPS_USER@$VPS_HOST" \
            "CUTOFF='$CUTOFF' bash -s" <<'REMOTE'
          set -eu
          umask 077
          ENV_FILE=/var/www/joydigi-hr/.env
          LINE="ATTENDANCE_FORGOTTEN_FINALIZATION_CUTOFF=$CUTOFF"

          touch "$ENV_FILE"

          # The same idempotent rebuild as the Firebase entry above: drop
          # any existing entry, append exactly one, carry every other value
          # across untouched, keep the file's own permissions, and replace
          # it in a single atomic move.
          TMP="$ENV_FILE.incoming"
          grep -v '^ATTENDANCE_FORGOTTEN_FINALIZATION_CUTOFF=' "$ENV_FILE" > "$TMP" || true
          echo "$LINE" >> "$TMP"
          chmod --reference="$ENV_FILE" "$TMP" 2>/dev/null || chmod 600 "$TMP"
          mv "$TMP" "$ENV_FILE"

          echo "ATTENDANCE_FORGOTTEN_FINALIZATION_CUTOFF set in .env"
          REMOTE

      - name: Deploy to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            -i ~/.ssh/id_ed25519 \
            "$VPS_USER@$VPS_HOST" \
            "/usr/local/bin/deploy-joydigi-hr"

      # Prove the credential landed and that Django can actually use it,
      # without revealing any of it: only the permission bits and a boolean
      # are ever printed.
      - name: Verify Firebase credential
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            -i ~/.ssh/id_ed25519 \
            "$VPS_USER@$VPS_HOST" \
            'bash -s' <<'REMOTE'
          set -eu
          CRED=/var/www/joydigi-hr/secrets/firebase-service-account.json

          if [ ! -f "$CRED" ]; then
            echo "No credential present; push notifications stay disabled."
            exit 0
          fi

          echo "permissions: $(stat -c '%a %U:%G' "$CRED")"
          python3 -c 'import json,sys; json.load(open(sys.argv[1]))' "$CRED"
          echo "credential JSON is valid"

          cd /var/www/joydigi-hr
          ./venv/bin/python manage.py shell -c 'from joydigi_api import push; print("push configured:", push.is_configured())'
          REMOTE

      - name: Verify website
        run: |
          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --max-time 30 \
            https://checkin.joydigi.net/login/ \
            > /dev/null

          echo "JoyDigi HR website OK"
