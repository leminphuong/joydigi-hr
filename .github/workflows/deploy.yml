name: Deploy JoyDigi HR

on:
  push:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: joydigi-hr-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy Production
    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      # The Firebase Admin private key, installed before the deploy step so
      # that the service restart at the end of it comes back up already able
      # to send push notifications.
      #
      # The JSON travels over ssh stdin — never as a command argument, which
      # would be visible in the server's process list, and never through
      # echo, which would put a private key into the build log. `umask 077`
      # means the file is not even briefly readable by anyone else between
      # being created and being chmod'ed.
      #
      # Absent secret is not a failure: push simply stays disabled and the
      # in-app notifications keep working, which is exactly how
      # `joydigi_api/push.py` behaves without a credential.
      - name: Install Firebase credential
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "FIREBASE_SERVICE_ACCOUNT_JSON is not set." >&2
            echo "Skipping: push stays disabled, in-app notifications unaffected." >&2
            exit 0
          fi

          # Validated here, on the runner, before a single byte is sent:
          # a malformed secret must fail this step rather than land on the
          # server. stderr is discarded on purpose — a JSONDecodeError
          # quotes the document it failed on, and that document is the
          # private key.
          if ! printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" \
            | python3 -c 'import json,sys; json.load(sys.stdin)' 2>/dev/null; then
            echo "::error title=Invalid Firebase credential::FIREBASE_SERVICE_ACCOUNT_JSON is not valid JSON. Nothing was sent to the server."
            exit 1
          fi

          # The remote script is an ARGUMENT, not a heredoc, and that is
          # the whole point of this shape.
          #
          # It used to be `... | ssh ... 'bash -s' <<'REMOTE'`, which asks
          # two different things to be ssh's stdin. The redirection wins,
          # so the JSON from the pipe was discarded and the remote
          # `cat > "$TMP"` swallowed the remainder of its own script
          # instead — the credential file was written with shell source
          # code, `mv` was never reached because those lines had been
          # eaten, and the step still exited 0. Reproduced byte for byte:
          # `cat` received 187 bytes of script where 212 bytes of JSON
          # were intended, no credential was ever created, and every
          # deploy reported success. That is why push has been silently
          # off in production.
          #
          # As an argument the script travels on the remote command line,
          # which is visible in the server's process list — it contains
          # only paths, never the secret. The secret stays on stdin,
          # exactly as before, so it appears in no process list on either
          # machine and in no log. Single-quoted so the runner's shell
          # expands none of the remote variables; the inner python
          # therefore uses double quotes, which is safe because it
          # contains no `$` for the remote shell to touch.
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" | ssh \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            -i ~/.ssh/id_ed25519 \
            "$VPS_USER@$VPS_HOST" \
            '
          set -eu
          umask 077
          CRED_DIR=/var/www/joydigi-hr/secrets
          CRED="$CRED_DIR/firebase-service-account.json"

          mkdir -p "$CRED_DIR"
          chmod 700 "$CRED_DIR"

          # Written to a temporary file first, so a transfer that dies
          # halfway cannot leave a truncated credential in place of a
          # working one.
          TMP="$CRED.incoming"
          cat > "$TMP"
          if ! python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$TMP" 2>/dev/null; then
            rm -f "$TMP"
            echo "received credential is not valid JSON; nothing was installed" >&2
            exit 1
          fi
          chmod 600 "$TMP"
          mv "$TMP" "$CRED"

          echo "Firebase credential installed"
          '

      # Point Django at the credential. The line is rewritten rather than
      # appended blindly, so deploying any number of times leaves exactly
      # one FIREBASE_CREDENTIALS_FILE entry, and every other value already
      # in .env — database, SECRET_KEY, ALLOWED_HOSTS — is carried across
      # untouched.
      - name: Configure FIREBASE_CREDENTIALS_FILE in .env
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            -i ~/.ssh/id_ed25519 \
            "$VPS_USER@$VPS_HOST" \
            'bash -s' <<'REMOTE'
          set -eu
          umask 077
          ENV_FILE=/var/www/joydigi-hr/.env
          LINE="FIREBASE_CREDENTIALS_FILE=/var/www/joydigi-hr/secrets/firebase-service-account.json"

          touch "$ENV_FILE"

          # Rebuilding the file is what makes this idempotent: dropping any
          # existing entry and re-adding one leaves no duplicates however
          # many times it runs, and grep's output always ends in a newline
          # so a file that was missing its final newline is fixed too.
          TMP="$ENV_FILE.incoming"
          grep -v '^FIREBASE_CREDENTIALS_FILE=' "$ENV_FILE" > "$TMP" || true
          echo "$LINE" >> "$TMP"
          chmod --reference="$ENV_FILE" "$TMP" 2>/dev/null || chmod 600 "$TMP"
          mv "$TMP" "$ENV_FILE"

          echo "FIREBASE_CREDENTIALS_FILE set in .env"
          REMOTE

      # Phase FUTURE-SAFE. This date is the switch that decides whether a
      # forgotten day shift is ever finalized at all: with no usable value
      # `finalization_cutoff()` returns None and the scheduled job returns
      # before it issues a single query. It is a policy date rather than a
      # credential, so it comes from a repository *variable* — visible and
      # editable in the settings UI without re-entering it — and never from
      # the repository, which must not carry a production date.
      #
      # Placed before "Deploy to VPS" deliberately: that step runs the
      # deploy script, and its `systemctl restart joydigi-hr` is what makes
      # gunicorn re-read settings. Writing the value afterwards would leave
      # every running worker on the old one until the next deployment.
      - name: Configure ATTENDANCE_FORGOTTEN_FINALIZATION_CUTOFF in .env
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          CUTOFF: ${{ vars.ATTENDANCE_FORGOTTEN_FINALIZATION_CUTOFF }}
        run: |
          # No value configured: say so and touch nothing. Writing an empty
          # entry, or dropping the existing one, would silently switch
          # finalization off on a deployment that never intended to.
          if [ -z "${CUTOFF:-}" ]; then
            echo "::warning title=Forgotten-session finalization not configured::The ATTENDANCE_FORGOTTEN_FINALIZATION_CUTOFF repository variable is empty or unset. Any value already present in the production .env is left exactly as it is; if there is none, forgotten day shifts are never finalized."
            exit 0
          fi

          # Validated here, on the runner, before a single byte reaches the
          # server: a bad value must not be able to replace a good one.
          if ! printf '%s' "$CUTOFF" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'; then
            echo "::error title=Invalid cutoff::ATTENDANCE_FORGOTTEN_FINALIZATION_CUTOFF must be exactly YYYY-MM-DD. The production .env was not modified."
            exit 1
          fi
          # Matching the shape is not being a date — 2026-02-30 and
          # 2026-13-01 both pass the pattern above. Round-tripping through
          # `date` rejects those, and comparing the result catches anything
          # it would quietly normalise rather than refuse.
          if ! normalised=$(date -u -d "$CUTOFF" +%Y-%m-%d 2>/dev/null) \
            || [ "$normalised" != "$CUTOFF" ]; then
            echo "::error title=Invalid cutoff::ATTENDANCE_FORGOTTEN_FINALIZATION_CUTOFF is not a real calendar date. The production .env was not modified."
            exit 1
          fi

          echo "Configuring forgotten-session finalization cutoff: $CUTOFF"

          # The value is a bare date, proven by the two checks above, so
          # interpolating it into the remote command is safe. It travels
          # that way rather than over stdin because stdin already carries
          # the script below.
          ssh \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            -i ~/.ssh/id_ed25519 \
            "$VPS_USER@$VPS_HOST" \
            "CUTOFF='$CUTOFF' bash -s" <<'REMOTE'
          set -eu
          umask 077
          ENV_FILE=/var/www/joydigi-hr/.env
          LINE="ATTENDANCE_FORGOTTEN_FINALIZATION_CUTOFF=$CUTOFF"

          touch "$ENV_FILE"

          # The same idempotent rebuild as the Firebase entry above: drop
          # any existing entry, append exactly one, carry every other value
          # across untouched, keep the file's own permissions, and replace
          # it in a single atomic move.
          TMP="$ENV_FILE.incoming"
          grep -v '^ATTENDANCE_FORGOTTEN_FINALIZATION_CUTOFF=' "$ENV_FILE" > "$TMP" || true
          echo "$LINE" >> "$TMP"
          chmod --reference="$ENV_FILE" "$TMP" 2>/dev/null || chmod 600 "$TMP"
          mv "$TMP" "$ENV_FILE"

          echo "ATTENDANCE_FORGOTTEN_FINALIZATION_CUTOFF set in .env"
          REMOTE

      # Phase OFFICE-IP-UPDATER-DEPLOY-WORKFLOW-INTEGRATION. The office's
      # public address changes whenever its modem restarts, and until the
      # attendance whitelist follows it every employee is refused at
      # check-in. Three values switch that maintenance on: the secret the
      # office agent signs its requests with, the company whose whitelist it
      # maintains, and how long the address being replaced stays valid beside
      # the new one.
      #
      # Placed before "Deploy to VPS" for the same reason as the two steps
      # above: that step runs the deploy script, whose `systemctl restart
      # joydigi-hr` is what makes gunicorn re-read settings.
      #
      # The secret travels inside the script on stdin, never as an argument
      # to ssh. An argument is visible in the remote `ps` output to every
      # other account on that host for as long as the command runs, which is
      # exactly what a credential must not be — so the two steps above,
      # which pass a path and a date that way, are not the pattern to copy
      # here. Base64 so that no character it happens to contain can end the
      # quoting.
      - name: Configure Office IP updater in .env
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          OFFICE_IP_SECRET: ${{ secrets.OFFICE_IP_UPDATER_SECRET }}
          OFFICE_IP_COMPANY_ID: ${{ vars.OFFICE_IP_UPDATER_COMPANY_ID }}
          OFFICE_IP_TTL_MINUTES: ${{ vars.OFFICE_IP_PREVIOUS_TTL_MINUTES }}
        run: |
          # Nothing configured at all: this deployment does not run the
          # office agent. Say so and touch nothing — with the secret unset
          # the endpoint answers 404, which is the correct state for it.
          if [ -z "${OFFICE_IP_SECRET:-}" ] \
            && [ -z "${OFFICE_IP_COMPANY_ID:-}" ] \
            && [ -z "${OFFICE_IP_TTL_MINUTES:-}" ]; then
            echo "::warning title=Office IP updater not configured::Neither OFFICE_IP_UPDATER_SECRET nor OFFICE_IP_UPDATER_COMPANY_ID is set, so the office IP whitelist is not maintained automatically. Any values already in the production .env are left exactly as they are."
            exit 0
          fi

          # Half-configured is a mistake rather than a choice, and guessing
          # the missing half is how the wrong company's whitelist gets
          # maintained. Refuse, and change nothing.
          if [ -z "${OFFICE_IP_SECRET:-}" ] || [ -z "${OFFICE_IP_COMPANY_ID:-}" ]; then
            echo "::error title=Office IP updater half-configured::Both OFFICE_IP_UPDATER_SECRET (secret) and OFFICE_IP_UPDATER_COMPANY_ID (variable) are required together. The production .env was not modified."
            exit 1
          fi

          # Validated here, on the runner, before a single byte reaches the
          # server — the same discipline as the cutoff step above. The
          # charset is also what keeps the value safe to write into a
          # `KEY=value` file unquoted.
          if ! printf '%s' "$OFFICE_IP_SECRET" | grep -Eq '^[A-Za-z0-9_-]{32,}$'; then
            echo "::error title=Invalid updater secret::OFFICE_IP_UPDATER_SECRET must be at least 32 characters from A-Z a-z 0-9 - _ (what python -c 'import secrets; print(secrets.token_urlsafe(48))' produces). Its value is never printed. The production .env was not modified."
            exit 1
          fi
          if ! printf '%s' "$OFFICE_IP_COMPANY_ID" | grep -Eq '^[1-9][0-9]*$'; then
            echo "::error title=Invalid company id::OFFICE_IP_UPDATER_COMPANY_ID must be a positive integer. The production .env was not modified."
            exit 1
          fi
          TTL="${OFFICE_IP_TTL_MINUTES:-120}"
          if ! printf '%s' "$TTL" | grep -Eq '^[0-9]+$'; then
            echo "::error title=Invalid TTL::OFFICE_IP_PREVIOUS_TTL_MINUTES must be a whole number of minutes. The production .env was not modified."
            exit 1
          fi

          echo "Configuring Office IP updater: company=$OFFICE_IP_COMPANY_ID previous_ttl=${TTL}m (the secret is never printed)"

          {
            printf 'OFFICE_IP_SECRET_B64=%s\n' "$(printf '%s' "$OFFICE_IP_SECRET" | base64 -w0)"
            printf 'OFFICE_IP_COMPANY_ID=%s\n' "$OFFICE_IP_COMPANY_ID"
            printf 'OFFICE_IP_TTL_MINUTES=%s\n' "$TTL"
            cat <<'REMOTE'
          set -eu
          umask 077
          ENV_FILE=/var/www/joydigi-hr/.env
          SECRET=$(printf '%s' "$OFFICE_IP_SECRET_B64" | base64 -d)

          touch "$ENV_FILE"

          # A timestamped copy before anything is rewritten, so a bad value
          # can be put back without reconstructing the file by hand. `cp -p`
          # carries the mode across; the explicit chmod is the fallback for a
          # filesystem where it does not.
          BACKUP="$ENV_FILE.backup-$(date -u +%Y%m%d-%H%M%S)"
          cp -p "$ENV_FILE" "$BACKUP"
          chmod --reference="$ENV_FILE" "$BACKUP" 2>/dev/null || chmod 600 "$BACKUP"
          echo "env backup: $BACKUP"

          # The same idempotent rebuild the two steps above use, for three
          # keys at once: drop any existing entry for each, append exactly
          # one, carry every other value across untouched, and replace the
          # file in a single atomic move.
          TMP="$ENV_FILE.incoming"
          grep -vE '^(OFFICE_IP_UPDATER_SECRET|OFFICE_IP_UPDATER_COMPANY_ID|OFFICE_IP_PREVIOUS_TTL_MINUTES)=' "$ENV_FILE" > "$TMP" || true
          printf '%s\n' "OFFICE_IP_UPDATER_SECRET=$SECRET" >> "$TMP"
          printf '%s\n' "OFFICE_IP_UPDATER_COMPANY_ID=$OFFICE_IP_COMPANY_ID" >> "$TMP"
          printf '%s\n' "OFFICE_IP_PREVIOUS_TTL_MINUTES=$OFFICE_IP_TTL_MINUTES" >> "$TMP"
          chmod --reference="$ENV_FILE" "$TMP" 2>/dev/null || chmod 600 "$TMP"
          mv "$TMP" "$ENV_FILE"

          # Read back before anything restarts. Exactly one entry per key,
          # and the two values that are not secret are the ones intended.
          # The secret is checked by presence and length only.
          for KEY in OFFICE_IP_UPDATER_SECRET OFFICE_IP_UPDATER_COMPANY_ID OFFICE_IP_PREVIOUS_TTL_MINUTES; do
            COUNT=$(grep -c "^$KEY=" "$ENV_FILE" || true)
            if [ "$COUNT" != "1" ]; then
              echo "expected exactly one $KEY entry in .env, found $COUNT" >&2
              exit 1
            fi
            echo "$KEY=***"
          done

          WROTE_COMPANY=$(grep '^OFFICE_IP_UPDATER_COMPANY_ID=' "$ENV_FILE" | cut -d= -f2-)
          if [ "$WROTE_COMPANY" != "$OFFICE_IP_COMPANY_ID" ]; then
            echo "company id in .env does not match the configured value" >&2
            exit 1
          fi
          WROTE_TTL=$(grep '^OFFICE_IP_PREVIOUS_TTL_MINUTES=' "$ENV_FILE" | cut -d= -f2-)
          if [ "$WROTE_TTL" != "$OFFICE_IP_TTL_MINUTES" ]; then
            echo "previous-TTL in .env does not match the configured value" >&2
            exit 1
          fi
          SECRET_LEN=$(grep '^OFFICE_IP_UPDATER_SECRET=' "$ENV_FILE" | cut -d= -f2- | tr -d '\n' | wc -c)
          if [ "$SECRET_LEN" -lt 32 ]; then
            echo "the secret written to .env is shorter than 32 characters" >&2
            exit 1
          fi

          echo "permissions: $(stat -c '%a %U:%G' "$ENV_FILE")"
          echo "secret length in .env: $SECRET_LEN"
          echo "Office IP updater configured in .env"
          REMOTE
          } | ssh \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            -i ~/.ssh/id_ed25519 \
            "$VPS_USER@$VPS_HOST" \
            'bash -s'

      - name: Deploy to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            -i ~/.ssh/id_ed25519 \
            "$VPS_USER@$VPS_HOST" \
            "/usr/local/bin/deploy-joydigi-hr"


      # Phase OFFICE-IP-UPDATER-DEPLOY-WORKFLOW-INTEGRATION. Proves Django
      # actually loaded what was written above, and that the route the office
      # agent will call exists — after the restart, because that is when the
      # new settings and the new code are both live.
      #
      # Only booleans, integers, a company name and a route path are printed.
      # The secret is reported as a boolean and a length, never as a value.
      #
      # Deliberately no HTTP request to the updater endpoint from here. That
      # endpoint records the address the request arrives from, so a call made
      # by this runner or by the VPS would teach it an address that is not
      # the office — the one mistake this feature must never make. Resolving
      # the route proves it exists without sending anything.
      - name: Verify Office IP updater configuration
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            -i ~/.ssh/id_ed25519 \
            "$VPS_USER@$VPS_HOST" \
            'bash -s' <<'REMOTE'
          set -eu
          cd /var/www/joydigi-hr

          # `shell` in argv is what keeps every scheduler in this project
          # from starting a background job for the duration of a one-line
          # read (attendance, base, employee, leave and pg_backup all guard
          # on it).
          ./venv/bin/python manage.py shell -c '
          from django.conf import settings
          from django.urls import reverse
          from base.models import AttendanceAllowedIP, Company

          secret = getattr(settings, "OFFICE_IP_UPDATER_SECRET", "") or ""
          company_id = getattr(settings, "OFFICE_IP_UPDATER_COMPANY_ID", 0)
          print("secret configured:", bool(secret))
          print("secret length:", len(secret))
          print("company id:", company_id)
          print("previous ttl minutes:", getattr(settings, "OFFICE_IP_PREVIOUS_TTL_MINUTES", None))
          print("max skew seconds:", getattr(settings, "OFFICE_IP_UPDATER_MAX_SKEW_SECONDS", None))
          print("route:", reverse("api-internal-update-office-ip"))

          company = Company.objects.filter(pk=company_id).first()
          print("company exists:", company is not None)
          print("company name:", company.company if company else None)
          rule = AttendanceAllowedIP.objects.filter(company_id=company).first() if company else None
          print("rule exists:", rule is not None)
          print("rule enabled:", bool(rule.is_enabled) if rule else None)

          assert secret, "OFFICE_IP_UPDATER_SECRET is not readable by Django"
          assert company is not None, "OFFICE_IP_UPDATER_COMPANY_ID names no company"
          '
          echo "Office IP updater configuration verified"
          REMOTE

      # Prove the credential landed and that Django can actually use it,
      # without revealing any of it: only the permission bits and a boolean
      # are ever printed.
      - name: Verify Firebase credential
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            -i ~/.ssh/id_ed25519 \
            "$VPS_USER@$VPS_HOST" \
            'bash -s' <<'REMOTE'
          set -eu
          CRED=/var/www/joydigi-hr/secrets/firebase-service-account.json

          if [ ! -f "$CRED" ]; then
            echo "No credential present; push notifications stay disabled."
            exit 0
          fi

          echo "permissions: $(stat -c '%a %U:%G' "$CRED")"
          python3 -c 'import json,sys; json.load(open(sys.argv[1]))' "$CRED"
          echo "credential JSON is valid"

          cd /var/www/joydigi-hr
          ./venv/bin/python manage.py shell -c 'from joydigi_api import push; print("push configured:", push.is_configured())'
          REMOTE

      - name: Verify website
        run: |
          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --max-time 30 \
            https://checkin.joydigi.net/login/ \
            > /dev/null

          echo "JoyDigi HR website OK"

          # Phase OFFICE-IP-UPDATER-DEPLOY-WORKFLOW-INTEGRATION: readiness,
          # not just reachability. A listening socket proves the restart
          # returned; this proves it came back with a working database.
          # Redis is not required — `/ready/` reports a cache only when
          # REDIS_URL is set, and this deployment does not set it.
          READY=$(curl \
            --fail \
            --silent \
            --show-error \
            --max-time 30 \
            https://checkin.joydigi.net/ready/)
          printf '%s\n' "$READY"
          printf '%s' "$READY" | grep -q '"status": "ok"' || {
            echo "readiness did not report status ok" >&2
            exit 1
          }
          printf '%s' "$READY" | grep -q '"database": "ok"' || {
            echo "readiness did not report database ok" >&2
            exit 1
          }
          echo "JoyDigi HR readiness OK"
