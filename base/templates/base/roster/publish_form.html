{% load i18n %}

<div class="oh-modal__dialog-header">
    <h2 class="text-md font-semibold" id="createTitle">
        Công bố lịch làm việc
    </h2>
    <button
        type="button"
        class="oh-modal__close--custom"
        onclick="$(this).closest('.oh-modal--show').removeClass('oh-modal--show')"
        aria-label="Đóng"
    >
        <ion-icon
            name="close-outline"
            role="img"
            class="md hydrated"
            aria-label="Đóng"
        ></ion-icon>
    </button>
</div>

<div class="oh-modal__dialog-body">
    <form hx-post="{% url 'roster-publish' %}" hx-target="#genericModalBody" hx-swap="innerHTML">
        {% csrf_token %}

        <div class="oh-general__tab-target oh-profile-section bg-[white] rounded-md border border-dark-50 w-full">
          <div class="oh-profile-section__card">
            <div class="row">
                <div class="col-12 mb-3">
                    <div class="oh-input-wrapper">
                        <label class="oh-label">Phòng ban</label>
                        <select name="department" class="oh-select oh-select-2 w-100">
                            <option value="">Tất cả phòng ban</option>
                            {% for dept in departments %}
                                <option value="{{ dept.pk }}">{{ dept.department }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>
                <div class="col-12 col-md-6 mb-3">
                    <div class="oh-input-wrapper">
                        <label class="oh-label oh-label--mandatory">Từ ngày</label>
                        <input type="date" name="from_date" class="oh-input w-100" required>
                    </div>
                </div>
                <div class="col-12 col-md-6 mb-3">
                    <div class="oh-input-wrapper">
                        <label class="oh-label">Đến ngày</label>
                        <input type="date" name="to_date" class="oh-input w-100">
                        <small
                            class="text-muted"
                            style="font-size: 11px"
                        >Để trống nếu muốn công bố toàn bộ lịch từ ngày bắt đầu.</small>
                    </div>
                </div>
            </div>

            <div class="oh-alert oh-alert--info mb-3" style="font-size: 13px">
                <ion-icon name="information-circle-outline" class="me-1"></ion-icon>
                Toàn bộ lịch chưa công bố trong khoảng này sẽ được hiển thị cho nhân viên.
            </div>

            <div class="oh-modal__dialog-footer p-0 mt-2">
                <button type="submit" class="oh-btn oh-btn--secondary oh-btn--shadow">
                    <ion-icon name="cloud-upload-outline" class="me-1"></ion-icon>
                    Công bố lịch
                </button>
            </div>
          </div>
        </div>
    </form>
</div>

<script>
    (function () {
      var body = document.getElementById("genericModalBody");
      if (body && typeof $ !== "undefined") {
        $(body).find("select").each(function () {
          if (!$(this).data("select2-id")) {
            $(this).addClass("oh-select oh-select-2").select2();
          }
        });
      }
    })();
</script>
