{% load static %}
<!doctype html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>JoyDigi Check-in</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f4f7fb; color: #172033; font-family: Arial, sans-serif; }
        main { width: min(92vw, 720px); padding: 44px; text-align: center; border-radius: 28px; background: #fff; box-shadow: 0 24px 70px rgba(35, 58, 94, .14); }
        h1 { margin: 0 0 10px; font-size: clamp(30px, 5vw, 52px); }
        p { margin: 0 0 26px; color: #5d6b82; font-size: clamp(16px, 2vw, 22px); }
        img { width: min(62vw, 420px); aspect-ratio: 1; border: 12px solid #f6f8fb; border-radius: 22px; }
        small { display: block; margin-top: 18px; color: #758197; }
    </style>
</head>
<body>
<main>
    <h1>Chấm công bằng mã QR</h1>
    <p>Mở máy ảnh điện thoại và quét mã bên dưới</p>
    <img id="kioskQr" src="{% url 'checkin-kiosk-qr' %}" alt="Mã QR chấm công">
    <small>Mã tự đổi sau mỗi 30 giây để bảo đảm an toàn.</small>
</main>
<script>
    setInterval(function () {
        document.getElementById('kioskQr').src = '{% url "checkin-kiosk-qr" %}?v=' + Date.now();
    }, 30000);
</script>
</body>
</html>
